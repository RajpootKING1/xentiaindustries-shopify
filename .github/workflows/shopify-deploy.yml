name: Shopify Theme Automated Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'shopify-theme/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Theme to Shopify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Deploy Theme via Shopify CLI
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_ACCESS_TOKEN }}
        run: |
          shopify theme push --path=shopify-theme --theme="${{ secrets.SHOPIFY_THEME_ID }}" --allow-live

